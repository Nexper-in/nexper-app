name: Translations

on:
  push:
  pull_request:

jobs:
  i18n:
    name: Every text is translated into all languages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Check translations
        run: node tools/check-i18n.mjs
